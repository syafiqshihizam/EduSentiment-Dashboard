<title>EduSentiment MY – Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Sora:wght@400;500;600&family=Orbitron:wght@500;800&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5ff;--card:#ffffff;--text:#0c1633;--muted:#5b6585;--line:#d9defa;
  --accent:#ff4d5e;--accent-ink:#ffffff;--sun:#ffc83d;--teal:#1fb5a5;--field:#f7f8ff;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;--ui:'Sora',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0a1128;--card:#121b3a;--text:#eef1ff;--muted:#9aa5cf;--line:#26325f;--field:#0d1530;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0a1128;--card:#121b3a;--text:#eef1ff;--muted:#9aa5cf;--line:#26325f;--field:#0d1530;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ui);line-height:1.5}
.page{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}

/* left showcase */
.show{position:relative;overflow:hidden;color:#eef1ff;padding:40px 48px;display:flex;flex-direction:column;justify-content:center;gap:32px}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.show>*:not(canvas){position:relative;z-index:1}



.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,4.6vw,4rem);line-height:1.02;margin:0 0 16px;max-width:12ch}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(24px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.hero p{margin:0;max-width:42ch;color:#b9c3f0;font-size:1rem}
.clock{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.flag{width:56px;height:32px;border-radius:4px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.4);flex:none;animation:wave 3s ease-in-out infinite;transform-origin:left center}
.time{font-family:'Orbitron','Courier New',monospace;font-weight:500;display:flex;align-items:baseline;gap:2px;line-height:1;font-size:clamp(2rem,3.4vw,2.8rem);letter-spacing:.04em;text-shadow:0 0 14px rgba(255,200,61,.45)}
.time .hh{font-size:clamp(4rem,8vw,6.6rem);font-weight:800;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.35)}
.time small{font-size:.9rem;margin-left:10px;color:#b9c3f0;text-shadow:none;letter-spacing:.05em}
.time i{font-style:normal;color:var(--sun);animation:blink 1s steps(2) infinite}
.date{color:#b9c3f0;font-size:.88rem;margin-top:6px}






/* right login */
.side{display:grid;place-items:center;padding:32px 24px;position:relative}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 32px 32px;box-shadow:0 30px 60px -30px rgba(12,22,51,.35);position:relative;overflow:hidden;animation:pop .8s cubic-bezier(.2,.9,.2,1) both}
.card.shake{animation:shake .45s}









h2{font-family:'Michroma','Orbitron',sans-serif;font-weight:400;font-size:1.35rem;letter-spacing:.02em;margin:0;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:.9rem;margin:4px 0 20px}






.f{position:relative;margin-bottom:14px}
.f input{width:100%;font:inherit;font-size:.95rem;color:var(--text);background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:22px 44px 8px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.f input:focus{border-color:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 22%,transparent)}
.f label{position:absolute;left:15px;top:15px;font-size:.92rem;color:var(--muted);pointer-events:none;transition:all .2s;transform-origin:left}
.f input:focus+label,.f input:not(:placeholder-shown)+label{top:6px;font-size:.7rem;color:var(--teal)}
.eye-btn{position:absolute;right:6px;top:8px;width:36px;height:36px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:10px;font-size:1.05rem}
.eye-btn:hover{color:var(--text)}
.eye-btn:focus-visible,.link:focus-visible,.go:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:.83rem;margin:2px 0 18px;color:var(--muted)}
.row label{display:flex;gap:8px;align-items:center;cursor:pointer}
.row input{accent-color:var(--accent);width:16px;height:16px}
.link{background:none;border:0;font:inherit;color:var(--accent);cursor:pointer;padding:2px;border-radius:6px;font-weight:500}
.go{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;color:var(--accent-ink);background:linear-gradient(120deg,var(--accent),#ff7a4d);cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s;box-shadow:0 12px 24px -12px var(--accent)}
.go:hover{transform:translateY(-2px)}.go:active{transform:scale(.98)}
.go .sp{display:none;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;margin:auto;animation:spin .7s linear infinite}
.go.load .t{display:none}.go.load .sp{display:block}
.msg{min-height:1.3em;font-size:.82rem;text-align:center;margin:12px 0 0;color:var(--muted)}
.msg.err{color:var(--accent)}
.ok{position:absolute;inset:0;background:var(--card);display:grid;place-content:center;text-align:center;gap:8px;padding:24px;opacity:0;pointer-events:none;transform:scale(.96);transition:all .4s}
.ok.on{opacity:1;pointer-events:auto;transform:none}
.ok .big{font-size:3.2rem;animation:bob 1.6s ease-in-out infinite}
.ok h3{font-family:var(--display);font-size:1.6rem;margin:0}
.ok p{margin:0;color:var(--muted);font-size:.9rem}
.ok button{margin-top:10px}
.mini{display:none;align-items:center;justify-content:center;gap:8px;font-size:.8rem;color:var(--muted);margin-top:16px;font-variant-numeric:tabular-nums}

.side{padding-top:68px}
.lang{position:absolute;top:18px;right:20px;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px;z-index:2}
.lang button{border:0;background:none;font:inherit;font-size:.78rem;font-weight:600;color:var(--muted);padding:6px 14px;border-radius:99px;cursor:pointer;transition:background .25s,color .25s}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lang button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.logo{display:block;width:88px;height:auto;margin:0 auto 12px;animation:bob 4s ease-in-out infinite}
h2 small{font-size:.85rem;color:var(--accent);margin-left:2px}
.greet{font-family:var(--display);font-weight:800;font-size:1.15rem;color:#fff;margin-bottom:8px}
.go{margin-top:8px}
html{background:#070c24}
body{background:radial-gradient(120% 90% at 15% 10%,#1b2a66 0%,#0b1233 60%,#070c24 100%) fixed}
.page{position:relative;z-index:1}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.97)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes blink{50%{opacity:.2}}
@keyframes wave{50%{transform:skewY(3deg) scaleX(.97)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media (max-width:900px){
  .page{grid-template-columns:1fr}
  .show{padding:24px;gap:16px;min-height:0}
  .hero p{display:none}.hero h1{font-size:2rem;max-width:none;margin:0}
  .clock .flag{width:44px;height:25px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.hero h1 span{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<main class="page">
  <section class="show" aria-label="EduSentiment MY overview">
    
    
    
    <div>
      
      <div class="clock">
        
        <div>
          <div class="greet" id="greet"></div><div class="time" id="time" aria-live="off">--:--:--</div>
          <div class="date" id="date">Waktu Malaysia (MYT, UTC+8)</div>
        </div>
      </div>
    </div>
  </section>

  <section class="side">

    var now=new Date(),p=tf.formatToParts(now),o={};
    p.forEach(function(x){o[x.type]=x.value});
    $('time').innerHTML='<span class="hh">'+o.hour+'</span><i>:</i><span>'+o.minute+'</span><i>:</i><span>'+o.second+'</span><small>'+(o.dayPeriod||'').toUpperCase()+'</small>';
    $('date').textContent=getDf().format(now)+' · MYT (UTC+8)';
    var h=parseInt(hf.format(now),10)%24,g=T[lang].greet[h<12?0:h<14?1:h<19?2:3];
    $('greet').textContent=g;
  }
  tick();setInterval(tick,1000);

  

  /* mood bubble field */
  var cv=$('field'),cx=cv.getContext('2d'),W,H,dpr=Math.min(devicePixelRatio||1,2),ms={x:-999,y:-999},faces=['😄','🙂','😐','🙁','🤩','📚','💡'],bs=[];
  function size(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  function make(){bs=[];var n=Math.round(Math.min(40,W*H/26000));for(var i=0;i<n;i++)bs.push({x:Math.random()*W,y:Math.random()*H,r:14+Math.random()*26,vx:(Math.random()-.5)*.3,vy:-.15-Math.random()*.35,e:faces[i%faces.length],p:Math.random()*6})}
  function draw(t){
    cx.clearRect(0,0,W,H);
    bs.forEach(function(b){
      var dx=b.x-ms.x,dy=b.y-ms.y,d=Math.hypot(dx,dy);
      if(d<140&&d>0){b.vx+=dx/d*.12;b.vy+=dy/d*.12}
      b.vx*=.985;b.vy=b.vy*.985+(-.012);
      if(!reduce){b.x+=b.vx+Math.sin(t/1400+b.p)*.25;b.y+=b.vy}
      if(b.y<-50){b.y=H+50;b.x=Math.random()*W}
      if(b.x<-50)b.x=W+50;if(b.x>W+50)b.x=-50;
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.283);cx.fillStyle='rgba(255,255,255,.07)';cx.fill();
      cx.strokeStyle='rgba(255,255,255,.14)';cx.stroke();
      cx.font=(b.r*1.05)+'px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(b.e,b.x,b.y+1);
    });
    if(!reduce)requestAnimationFrame(draw);
  }
  var show=document.documentElement;
  show.addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();ms.x=e.clientX-r.left;ms.y=e.clientY-r.top});
  show.addEventListener('pointerleave',function(){ms.x=ms.y=-999});
  addEventListener('resize',function(){size();make();if(reduce)draw(0)});
  size();make();requestAnimationFrame(draw);

  
  
  
  

  
  
  
  
  var email=$('email'),pw=$('pw');
  var okMail=function(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)};
  
  
  
  
  $('eye').addEventListener('click',function(){
    var s=pw.type==='password';pw.type=s?'text':'password';
    this.textContent=s?'🙈':'👁';this.setAttribute('aria-label',tr(s?'hide':'show'));
    this.dataset.show=s?'1':'';
    
    pw.focus();
  });
  

  /* messages */
  var msg=$('msg');
  function say(k,c){msg.className='msg'+(c?' '+c:'');msg.dataset.k=k;msg.textContent=tr(k)}
  document.querySelectorAll('[data-m]').forEach(function(b){b.addEventListener('click',function(){say(b.dataset.m)})});
  function fail(t){
    say(t,'err');
    var c=$('card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  }

  /* language switch (BM / EN) */
  var session=null;
  function renderOk(){if(!session)return;$('okh').textContent=tr('welcome').replace('{n}',session.name);$('okp').textContent=tr('loggedAs')}
  function setLang(l){
    lang=l;document.documentElement.lang=l;document.title=tr('title');
    document.querySelectorAll('[data-i]').forEach(function(el){el.textContent=tr(el.dataset.i)});
    document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.l===l))});
    $('eye').setAttribute('aria-label',tr(pw.type==='text'?'hide':'show'));
    msg.textContent=tr(msg.dataset.k||'');renderOk();tick();
    try{localStorage.setItem('edu-lang',l)}catch(e){}
  }
  document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.l)})});
  setLang(lang);

  /* submit (demo only: no real authentication) */
  $('form').addEventListener('submit',function(e){
    e.preventDefault();say('');
    if(!okMail(email.value)){fail('errEmail');email.focus();return}
    if(pw.value.length<6){fail('errPw');pw.focus();return}
    var go=$('go');go.classList.add('load');go.disabled=true;
    setTimeout(function(){
      var name=email.value.split('@')[0];
      session={name:name};try{sessionStorage.setItem('myeducation_logged_in','true');sessionStorage.setItem('myeducation_user',name.charAt(0).toUpperCase()+name.slice(1))}catch(e){}
      renderOk();
      $('ok').classList.add('on');go.classList.remove('load');go.disabled=false;window.__r=setTimeout(function(){location.href='education.html'},1800);
    },1300);
  });
  $('out').addEventListener('click',function(){
    $('ok').classList.remove('on');pw.value='';session=null;clearTimeout(window.__r);try{sessionStorage.removeItem('myeducation_logged_in');sessionStorage.removeItem('myeducation_user')}catch(e){}say('loggedOut');
  });
})();
</script>
</body>
</html>
