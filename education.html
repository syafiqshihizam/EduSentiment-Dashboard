      url("fonts/NeutronaTech.ttf") format("truetype");
  font-display:swap;
}
:root{
  --bg:#0d0b2e; --bg2:#17124d; --surface:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --text:#f2f0ff; --muted:#a9a4d6; --accent:#5ee08a; --accent2:#ff7a45; --blue:#2f8bff;
  --glow:rgba(94,224,138,.18);
}
:root[data-theme="light"]{
  --bg:#f3f2fb; --bg2:#e4e1f7; --surface:rgba(255,255,255,.75); --line:rgba(40,30,120,.14);
  --text:#1a1550; --muted:#5b5798; --accent:#16a34a; --accent2:#e2571f; --blue:#1d6fe0;
  --glow:rgba(47,139,255,.14);
}
*{box-sizing:border-box}
html{height:100%; overflow:hidden}
body{
  margin:0; height:100vh; height:100dvh; overflow:hidden; display:flex; flex-direction:column; color:var(--text);
  font-family:"Plus Jakarta Sans",system-ui,Arial,sans-serif;
  background:
    radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 60%),
    radial-gradient(700px 450px at 0% 0%,rgba(255,122,69,.10),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
}
header{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  gap:16px; padding:12px clamp(16px,4vw,40px);
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:12px}
.logo{
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--accent)); color:#fff;
}
.brand b{font-family:Fraunces,Georgia,serif; font-size:1.2rem; letter-spacing:.01em}
.actions{display:flex; align-items:center; gap:10px}
.user{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.85rem}
.avatar{width:30px; height:30px; border-radius:50%; background:var(--accent2); color:#fff; display:grid; place-items:center; font-weight:600; font-size:.8rem}
button{font:inherit; cursor:pointer}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:.88rem; font-weight:500;
  transition:background .2s,border-color .2s,transform .15s;
}
.btn:hover{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--text); color:var(--bg); border-color:transparent}
.btn.primary:hover{background:var(--accent); color:#06210f}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.intro{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:22px}
h1{font-family:Fraunces,Georgia,serif; font-size:clamp(1.7rem,3.6vw,2.7rem); line-height:1.1; margin:0 0 10px; max-width:20ch}
.intro p{margin:0; color:var(--muted); max-width:62ch; line-height:1.6}
/* Power BI report fills everything below the header */
main{flex:1 1 auto; min-height:0; width:100%; max-width:none; margin:0; padding:0; overflow-x:hidden; overflow-y:auto; background:#1f1485; scrollbar-width:thin}
/* stage = report page area; its height is set by JS so the 16:9 page spans the full width */
.stage{position:relative; width:100%; min-height:100%; overflow:hidden; margin:0; padding:0}
iframe{position:absolute; top:0; left:0; width:100%; max-width:none; height:calc(100% + var(--bar,62px)); border:0; margin:0; padding:0; display:block; opacity:0; transition:opacity .6s}
iframe.ready{opacity:1}
.loader{position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:16px; color:#cfcaff; transition:opacity .4s}
.loader.hide{opacity:0; pointer-events:none}
.bars{display:flex; align-items:flex-end; gap:6px; height:44px}
.bars span{width:8px; border-radius:3px; background:linear-gradient(var(--accent),var(--blue)); animation:bar 1s ease-in-out infinite}
.bars span:nth-child(2){animation-delay:.12s} .bars span:nth-child(3){animation-delay:.24s} .bars span:nth-child(4){animation-delay:.36s}
@keyframes bar{0%,100%{height:12px} 50%{height:44px}}

/* animated emoji background */
.bg{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
.bg span{position:absolute; bottom:-60px; opacity:0; filter:saturate(1.1); animation:floatUp linear infinite; will-change:transform}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0}
  10%{opacity:var(--o,.35)}
  50%{transform:translateY(-55vh) translateX(var(--dx,30px)) rotate(var(--r,20deg))}
  90%{opacity:var(--o,.35)}
  100%{transform:translateY(-115vh) translateX(calc(var(--dx,30px) * -1)) rotate(calc(var(--r,20deg) * -1)); opacity:0}
}
:root[data-theme="light"] .bg span{--o:.28}
header,main{position:relative; z-index:2}
header{position:relative; flex:0 0 auto; z-index:20}


footer{max-width:1500px; margin:0 auto; padding:8px clamp(16px,4vw,40px) 32px; color:var(--muted); font-size:.8rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
/* header, matching the reference design */
:root{--hbg:#021033; --hline:rgba(80,140,255,.22)}
:root[data-theme="light"]{--hbg:#ffffff; --hline:rgba(40,30,120,.14)}
header{background:var(--hbg); backdrop-filter:none; padding:0 clamp(14px,3vw,32px); height:68px; border-bottom:1px solid var(--hline)}
img.logo{width:auto; height:50px; display:block; background:none; border-radius:0; filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.brand{gap:14px}
.brand-text{display:flex; flex-direction:column; line-height:1.15; padding-right:20px}
.brand-text b{font-family:"Neutrona Tech","Michroma",system-ui,sans-serif; font-size:1.3rem; font-weight:400; letter-spacing:.02em; white-space:nowrap}
.brand-text b .my{font-size:.62em; color:#ff4f7b; letter-spacing:.14em; margin-left:.7em; font-weight:400; text-transform:uppercase}
.brand-text small{font-size:.72rem; color:var(--muted); margin-top:3px}
.actions{gap:16px}
.vsep{width:1px; height:34px; background:var(--hline)}
.theme-pill{display:flex; gap:4px; padding:4px; border-radius:999px; border:1px solid var(--hline); background:rgba(20,60,160,.18)}
:root[data-theme="light"] .theme-pill{background:rgba(40,30,120,.06)}
.theme-pill button{width:32px; height:32px; border-radius:50%; border:0; background:transparent; color:var(--muted); display:grid; place-items:center; transition:background .25s,color .25s}
.theme-pill button[aria-pressed="true"]{background:rgba(47,139,255,.28); color:#5fb0ff; box-shadow:0 0 0 1px rgba(95,176,255,.4)}
:root[data-theme="light"] .theme-pill button[aria-pressed="true"]{background:#fff; color:#1d6fe0; box-shadow:0 1px 6px rgba(40,30,120,.2)}
.theme-pill svg{width:17px; height:17px}
.menu{position:relative}
.user-btn{display:flex; align-items:center; gap:10px; background:transparent; border:0; color:var(--text); padding:4px 6px; border-radius:10px}
.user-btn:hover{background:var(--surface)}
.avatar{width:40px; height:40px; background:#8fb4ff; color:#fff; font-size:1.05rem; font-weight:500}
.uname{font-size:.95rem; font-weight:500}
.chev{width:16px; height:16px; color:var(--muted); transition:transform .2s}
.user-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dropdown{
  position:absolute; right:0; top:calc(100% + 10px); min-width:170px; padding:6px; border-radius:12px;
  background:var(--hbg); border:1px solid var(--hline); box-shadow:0 18px 40px rgba(0,0,40,.45);
  opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .18s,transform .18s;
}
.menu.open .dropdown{opacity:1; transform:none; pointer-events:auto}
.dropdown button{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:0; border-radius:8px; background:transparent; color:var(--text); font-size:.9rem; text-align:left}
.dropdown button:hover{background:rgba(255,90,90,.14); color:#ff6b6b}
@media (max-width:640px){.uname,.brand-text small{display:none} .brand-text{padding-right:0} .brand-text b{font-size:1.05rem}}

@media (max-width:640px){.user span{display:none} .btn .label{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<script>
  const report = document.getElementById("report");
  const loader = document.getElementById("loader");

  // Height of Power BI's bottom bar in px (cropped off by the iframe overflow)
  const screenEl = document.getElementById("screen"), stage = document.getElementById("stage");
  screenEl.style.setProperty("--bar", "62px");

  // Power BI "fit to page" letterboxes the page when the frame is wider than the report's ratio.
  // Keep the frame at least as tall as a 16:9 page at the current width so it fills edge to edge.
  const RATIO = 16 / 9;
  function fit(){
    const h = Math.max(screenEl.clientHeight, Math.ceil(screenEl.offsetWidth / RATIO));
    stage.style.height = h + "px";
  }
  addEventListener("resize", fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(screenEl);
  fit();

  function showReport(){ report.classList.add("ready"); loader.classList.add("hide"); }
  report.addEventListener("load", showReport);
  setTimeout(showReport, 12000); // fallback if the load event is slow

  // Light / dark toggle (remembered when storage is available)
  const root = document.documentElement;
  const bL = document.getElementById("themeLight"), bD = document.getElementById("themeDark");
  function setTheme(t){
    root.dataset.theme = t;
    bL.setAttribute("aria-pressed", t === "light"); bD.setAttribute("aria-pressed", t === "dark");
    try{ localStorage.setItem("myedu_theme", t); }catch(e){}
  }
  let saved = null; try{ saved = localStorage.getItem("myedu_theme"); }catch(e){}
  setTheme(saved || "dark");
  bL.onclick = () => setTheme("light"); bD.onclick = () => setTheme("dark");

  // User name (optional: store it at login with sessionStorage.setItem("myeducation_user","Name"))
  try {
    const n = sessionStorage.getItem("myeducation_user");
    if (n) { document.getElementById("uname").textContent = n; document.getElementById("avatar").textContent = n.trim()[0].toUpperCase(); }
  } catch(e){}

  // Profile dropdown (Log out is hidden inside)
  const menu = document.getElementById("menu"), userBtn = document.getElementById("userBtn");
  function toggleMenu(open){ menu.classList.toggle("open", open); userBtn.setAttribute("aria-expanded", open); }
  userBtn.onclick = e => { e.stopPropagation(); toggleMenu(!menu.classList.contains("open")); };
  document.addEventListener("click", () => toggleMenu(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape") toggleMenu(false); });

  // Floating emoji background
  const emojis = ["🎓","📚","😊","😐","😠","✏️","🏫","👨‍👩‍👧","📊","💬","⭐","🎒","💡","📝"];
  const bg = document.getElementById("bg");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let i = 0; i < 26; i++) {
      const e = document.createElement("span");
      e.textContent = emojis[i % emojis.length];
      e.style.left = (Math.random() * 96) + "%";
      e.style.fontSize = (20 + Math.random() * 30) + "px";
      e.style.animationDuration = (16 + Math.random() * 18) + "s";
      e.style.animationDelay = (-Math.random() * 30) + "s";
      e.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
      e.style.setProperty("--r", (Math.random() * 50 - 25) + "deg");
      bg.appendChild(e);
    }
  }

  function logout() {
    sessionStorage.removeItem("myeducation_logged_in");
    window.location.href = "index.html";
  }
</script>
</body>
